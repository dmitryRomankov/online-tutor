name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/Cypress
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run Jest with frontend and backend coverage
        id: coverage
        run: npm run test:coverage
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload frontend coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/
          if-no-files-found: error
          overwrite: true
      - name: Upload backend coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: api/coverage/
          if-no-files-found: error
          overwrite: true

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/postgres
      TEST_DATABASE_ISOLATED: '1'
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:auth:integration
      - run: npm run db:validate
